name: Publish to MCP Registry

# 把 server.json 发布到 MCP 官方注册表（registry.modelcontextprotocol.io）。
# 走 GitHub Actions OIDC 换 registry JWT —— 不需要任何人工授权/浏览器点确认。
# 触发：server.json 或 package.json 变动推到 master，或手工 dispatch。

on:
  push:
    branches: [ master ]
    paths: [ server.json, package.json ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exchange GitHub OIDC token for MCP Registry JWT
        id: auth
        run: |
          set -euo pipefail
          echo "REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL}"
          # 关键：registry 会校验 OIDC audience —— 必须是 https://registry.modelcontextprotocol.io，
          # 默认的 github  audience 会直接被 401 "invalid audience" 拒掉。
          OIDC=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                 "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fregistry.modelcontextprotocol.io" \
                 | jq -r '.value')
          if [ -z "$OIDC" ] || [ "$OIDC" = "null" ]; then
            echo "::error::failed to obtain GitHub OIDC token"; exit 1
          fi
          Rsp=$(curl -sS -X POST https://registry.modelcontextprotocol.io/v0/auth/github-oidc \
                -H 'Content-Type: application/json' \
                -d "{\"oidc_token\":\"$OIDC\"}")
          echo "exchange=${Rsp}"
          # 注意：registry 返回的是 registry_token 字段，不是 token
          JWT=$(printf '%s' "$Rsp" | jq -r '.registry_token // .token // empty')
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
            echo "::error::registry JWT exchange failed"; exit 1
          fi
          echo "::add-mask::$JWT"
          echo "jwt=$JWT" >> "$GITHUB_ENV"

      - name: Validate server.json against registry schema
        run: |
          set -euo pipefail
          echo "--- validate ---"
          curl -sS -X POST https://registry.modelcontextprotocol.io/v0/validate \
            -H 'Content-Type: application/json' --data @server.json

      # 版本漂移守卫（2026-10-03）：server.json 曾长期卡在 1.0.19 而 package.json 已是 1.0.22。
      # registry 对同名 server 的重复版本号会直接拒（version already exists），
      # 于是「第一版注册成功、第二版开始永远失败」——2571 历史失败里同一根因。
      # 这里提前拦住，错误信息直接指到要改哪一行。
      - name: Guard all version manifests against package.json
        # 2026-10-03 扩展：原来只查 server.json 三处，漏掉 registry-server.json(1.0.19) 与
        # glama.json(1.0.19)——它们同样是「对外声明的版本」，卡 3 个版本会骗过 CI 却发错版。
        # 现在五处（server.json 2 处 + registry-server.json + glama.json + package.json）全查。
        run: |
          set -euo pipefail
          PV=$(node -p "require('./package.json').version")
          SV=$(node -p "require('./server.json').version")
          SPV=$(node -p "require('./server.json').packages[0].version")
          RV=$(node -p "require('./registry-server.json').version")
          GV=$(node -p "require('./glama.json').version")
          echo "package.json=$PV  server.json=$SV  server.packages[0]=$SPV  registry-server.json=$RV  glama.json=$GV"
          if [ "$SV" != "$PV" ] || [ "$SPV" != "$PV" ] || [ "$RV" != "$PV" ] || [ "$GV" != "$PV" ]; then
            echo "::error::版本漂移: 必须五处一致（package.json=$PV / server.json=$SV / packages[0]=$SPV / registry-server.json=$RV / glama.json=$GV）"
            exit 1
          fi

      - name: Publish server to MCP Registry
        run: |
          set -euo pipefail
          echo "--- publish ---"
          Http=$(curl -sS -o resp.txt -w '%{http_code}' \
                -X POST https://registry.modelcontextprotocol.io/v0/publish \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer ${jwt}" \
                --data @server.json)
          echo "publish HTTP $Http"
          cat resp.txt
          if [ "$Http" != "200" ] && [ "$Http" != "201" ] && [ "$Http" != "204" ]; then
            echo "::error::publish failed with HTTP $Http"; exit 1
          fi
