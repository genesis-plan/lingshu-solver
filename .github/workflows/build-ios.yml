name: Build & Upload iOS App

# 触发：您完成 Apple Developer 组织 enrollment 后
#   ① 在仓库 Settings → Secrets 填好 7 个密（见 ios-turnkey.md §1）
#   ② 本地跑一次 ios-app/csr.sh 生成 CSR，按提示在 Apple 后台换 .cer → 用 ios-app/csr.sh 转 .p12
#   ③ 在 App Store Connect 建 App + 分发描述文件(.mobileprovision)，base64 存为密
#   ④ 给个 tag：git tag ios-v1.0.15 && git push --tags  → 本流水线(macOS runner)自动出包上传
# 您全程无需本地 Mac；Xcode 由 GitHub macOS runner 承担。
on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Capacitor deps
        working-directory: ios-app
        run: npm ci

      - name: Generate native iOS project (cap add ios)
        working-directory: ios-app
        run: npx cap add ios || true

      - name: Sync web assets into native shell
        working-directory: ios-app
        run: node copy-www.js && npx cap sync ios

      # ---- 代码签名：从密导入 P12 证书 + 分发描述文件（无需本地 Mac）----
      - name: Import signing certificate & provisioning profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$IOS_P12_BASE64" | base64 --decode > /tmp/ios_dist.p12
          security create-keychain -p "" build.keychain
          security import /tmp/ios_dist.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/lingshu.mobileprovision

      - name: Write export.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          cat > ios-app/ios/App/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hclj.lingshu</key><string>$IOS_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Archive (xcodebuild)
        working-directory: ios-app/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_NAME: ${{ secrets.IOS_DIST_CERT_NAME }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath build/App.xcarchive archive \
            CODE_SIGN_STYLE=manual \
            CODE_SIGN_IDENTITY="$IOS_DIST_CERT_NAME" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export IPA
        working-directory: ios-app/ios/App
        run: xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build -exportOptionsPlist export.plist

      - name: Upload to App Store Connect
        env:
          ASC_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          echo "$ASC_P8" > /tmp/asc.p8
          xcrun altool --upload-app -f ios-app/ios/App/build/App.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER" --apiPrivateKey /tmp/asc.p8 \
            || xcrun altool --upload-app -f ios-app/ios/App/build/App.ipa \
               -u "apikey:$ASC_KEY_ID" -p "$(cat /tmp/asc.p8)"
