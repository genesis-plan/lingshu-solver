<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- 发光圆圈 -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#3B82F6" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.4"/>
  <!-- 数学符号 Σ -->
  <text x="160" y="300" font-family="serif" font-size="120" font-weight="bold" fill="#3B82F6" opacity="0.8">Σ</text>
  <!-- 等号 = -->
  <line x1="280" y1="220" x2="380" y2="220" stroke="#60A5FA" stroke-width="6" stroke-linecap="round"/>
  <line x1="280" y1="250" x2="380" y2="250" stroke="#60A5FA" stroke-width="6" stroke-linecap="round"/>
  <!-- 变量 x,y,z -->
  <text x="290" y="300" font-family="serif" font-size="60" font-style="italic" fill="#E2E8F0">x, y, z</text>
  <!-- 底部装饰线 -->
  <line x1="120" y1="370" x2="392" y2="370" stroke="#3B82F6" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <!-- 小点装饰 -->
  <circle cx="140" cy="370" r="4" fill="#3B82F6" opacity="0.8"/>
  <circle cx="372" cy="370" r="4" fill="#3B82F6" opacity="0.8"/>
</svg>