# mcpize.yaml — 灵数求解器 MCPize 部署配置
# 上架路径：GitHub Deploy（MCPize 从 genesis-plan/lingshu-solver 拉取、构建、托管）
# 重要：本服务按次计费默认 OFF（LS_METERING 不设置即 off）。
#   ⇒ MCPize 托管的是"无收费实例"，由 MCPize 的 Stripe 层统一计费（80% 给创作者）。
#   切勿在 secrets 里开 LS_METERING=on，否则会与 MCPize 计费双重收费。
version: 1
name: lingshu-solver
description: |
  Lingshu Solver — deterministic (non-LLM) MCP tool for systems of real equations. Up to 6 variables and
  64 equations: interval contraction + affine arithmetic + Krawczyk certification, zero dependencies,
  offline, no data upload, unproven completeness honestly flagged as truncated. Calls no language model;
  output is verifiable and reproducible.

runtime: typescript
entry: http-mcp-server.js

# 零依赖 Node 服务，无需转译；install 仅生成空 node_modules，command 为占位无操作
build:
  install: npm ci
  command: node -e "console.log('lingshu-solver: zero-dependency, no build step')"

startCommand:
  type: http
  command: node http-mcp-server.js

# 探活：服务根路径 / 与 /health 均返回 200 元信息
health_check: /health

# 说明：MCPize 通过统一网关代理并计数，创作者侧无需写任何计费逻辑。
# 价格档位在 MCPize Dashboard 配置（free / pro / enterprise），不在本文件。
