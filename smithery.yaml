name: lingshu-solver
displayName: 灵数求解器 Lingshu Solver
description: 确定性（非大模型）实数方程组求解 MCP 工具，≤6 变量，算得对、不随机、不幻觉。每个结果都带结构化决策字段（conclusion + trust.trustLevel + agentAction），Agent 直接照着做即可，不用自己判断全不全、能不能用。支持常用超越函数，零依赖、离线、无数据上传。本地 stdio 零安装即用：npx -y lingshu-solver；另有常驻托管端点 https://hongchenlingjing.com/mcp（当前不按次计费、无需凭证，honorPaid 免费放行 —— 不付费也能用）。商业使用须版权方书面授权（见 LICENSE）。
metadata:
  category: math
  author: genesis-plan
  tags:
    - math
    - solver
    - equation
    - equation-system
    - algebra
    - deterministic
    - non-llm
    - agent-tool
    - interval-arithmetic
    - krawczyk
startCommand:
  type: stdio
  command: npx
  args:
    - -y
    - lingshu-solver
